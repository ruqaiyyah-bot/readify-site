<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >
  <title>Readify | Reading Flow</title>

  <!-- CSS -->
  <link rel="stylesheet" href="flow.css" >
  <link rel="stylesheet" href="style.css" >
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="pages.css">
  <link rel="icon" href="images/favicon.png" >
</head>

<body>

  <!-- HEADER -->
  <header>
    <nav>
      <h1>Readify</h1>
      <div class="hamburger" id="hamburger">
        <span></span>
         <span></span>
         <span></span>
       </div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="explorer.html">Book Explorer</a></li>
        <li><a href="progress.html">Progress</a></li>
        <li><a href="recommend.html">Recommend</a></li>
        <li><a href="flow.html">Reading Flow</a></li>
        <li><a href="feedback.html">Feedback</a></li>
      </ul>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <main>

    <!-- PAGE TITLE + SOUND CONTROL -->
    <section id="flow-header">
      <h2>My Reading Flow</h2>

      <div class="sound-control">
        <button id="play-sound" aria-label="Play cozy sounds">▶</button>
        <p>Press play,<br> get comfy,<br> and dive in.</p>
      </div>

      <!-- Cozy Sound -->
      <audio id="cozy-sound" src="images/JBlanked - True Friends.mp3" loop></audio>
    </section>

    <!-- FLOW CONTAINER -->
    <section id="flow-container">

      <!-- READING LIST -->
      <section class="reading-list">
        <h3>Reading list:</h3>
        <div id="reading-list-grid" class="book-grid">
          <!-- JS will inject book cards here -->
        </div>
      </section>

      <!-- COMPLETED BOOKS -->
      <section class="completed-books">
        <h3>Books completed:</h3>
        <div id="completed-books-grid" class="book-grid">
          <!-- JS will inject book cards here -->
        </div>
      </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <center>
      <p>&copy; 2025 Readify. All rights reserved.</p>
    </center>
  </footer>

  <!-- JavaScript -->
  <script src="books.js"></script>
</body>

</html>
