<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >

  <link rel="icon" href="link your icon img here">
  <!-- CSS -->
  <link rel="stylesheet" href="feedback.css" >
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="pages.css">
  <link rel="icon" href="images/favicon.png" >
</head>

<body>

  <!-- HEADER -->
  <header>
    <nav>
      <h1>Readify</h1>
      <div class="hamburger" id="hamburger">
        <span></span>
         <span></span>
         <span></span>
       </div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="explorer.html">Book Explorer</a></li>
        <li><a href="progress.html">Progress</a></li>
        <li><a href="recommend.html">Recommend</a></li>
        <li><a href="flow.html">Reading Flow</a></li>
        <li><a href="feedback.html">Feedback</a></li>
      </ul>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <main>

    <section id="feedback-container">

      <!-- LEFT SIDE : FORM -->
      <section class="feedback-form">
        <h2>Help us make Readify even better</h2>
        <h3>Your Thoughts = Our Magic</h3>

        <form id="feedback-form">
          <label for="name">Name:</label>
          <input type="text" id="name" required />

          <label for="email">Email:</label>
          <input type="email" id="email" required />

          <label for="message">Message:</label>
          <textarea id="message" rows="6" required></textarea>

          <button type="submit"
            style="background: #6a1b9a; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px;">Send
            Feedback</button>
        </form>
      </section>


      <!-- RIGHT SIDE : IMAGE / VISUAL -->
      <section class="feedback-visual">
        <img src="images/Reading.png" alt="Feedback illustration placeholder" />
      </section>

    </section>

  </main>

  <!-- FOOTER -->
  <footer>
    <center>

    </center>
  </footer>

</body>

</html>
