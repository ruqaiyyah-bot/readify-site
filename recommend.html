<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >
  <title>Readify | Recommend</title>

  <!-- CSS -->
  <link rel="stylesheet" href="reccomend.css">
  <link rel="stylesheet" href="style.css" >
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="pages.css">
  <link rel="icon" href="images/favicon.png" >
</head>

<body>

  <!-- HEADER -->
  <header>
    <nav>
      <h1>Readify</h1>
      <div class="hamburger" id="hamburger">
        <span></span>
         <span></span>
         <span></span>
       </div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="explorer.html">Book Explorer</a></li>
        <li><a href="progress.html">Progress</a></li>
        <li><a href="recommend.html">Recommend</a></li>
        <li><a href="flow.html">Reading Flow</a></li>
        <li><a href="feedback.html">Feedback</a></li>
      </ul>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <main>

    <!-- PAGE TITLE -->
    <section id="recommend-intro">
      <h2>Can’t pick a book? Readify has your back!</h2>
    </section>

    <!-- RECOMMENDER BOX -->
    <section id="recommender-box">
      <h3>Random Book Recommend</h3>

      <!-- FILTER FORM -->
      <form id="recommend-form">
        <label for="genre">Genre:</label>
        <select id="genre">
          <option value="all">All Genres</option>
          <option value="fiction">Fiction</option>
          <option value="fantasy">Fantasy</option>
          <option value="scifi">Sci-Fi</option>
        </select>

        <label for="length">Length:</label>
        <select id="length">
          <option value="all">Any Length</option>
          <option value="short">Short</option>
          <option value="medium">Medium</option>
          <option value="long">Long</option>
        </select>

        <button type="button" id="pick-random">Recommend</button>
      </form>

      <!-- RECOMMENDED BOOK DISPLAY -->
      <div id="recommendation-result"></div>
      <h4>Recommended Book:</h4>

      <div id="recommendation-result">
      </div>

      <div class="recommend-actions" id="action-container" style="display: none;">
        <button type="button" id="pick-again-btn">Pick again</button>
      </div>


    </section>

  </main>

  <!-- FOOTER -->
  <footer>
    <center>
      <p>&copy; 2025 Readify. All rights reserved.</p>
    </center>
  </footer>

  <!-- JavaScript -->
  <script src="books.js"></script>
</body>

</html>
